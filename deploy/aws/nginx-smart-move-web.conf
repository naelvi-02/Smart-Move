server {
  listen 80;
  listen [::]:80;
  server_name scrap.naelvi.com;

  root /var/www/smart-move-web;
  index index.html;

  # Serve Next.js exported static files
  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }

  # Fallback for dynamic Next.js routes (if needed, but output is 'export' so it's static)
  location ~ \.html$ {
    try_files $uri =404;
  }

  # Proxy API requests to backend
  # We already set NEXT_PUBLIC_API_URL="https://api.naelvi.com" in the frontend,
  # but just in case they visit /api directly on the scrap domain.
  location /api/ {
    proxy_pass http://127.0.0.1:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

name: Deploy Backend VPS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'deploy/aws/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          DEPLOY_PORT="${{ secrets.VPS_PORT }}"
          if [ -z "$DEPLOY_PORT" ]; then DEPLOY_PORT=22; fi
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_USER }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "Missing one of VPS_HOST / VPS_USER / VPS_SSH_KEY secrets"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          touch ~/.ssh/known_hosts

      - name: Deploy backend on VPS
        run: |
          DEPLOY_PORT="${{ secrets.VPS_PORT }}"
          if [ -z "$DEPLOY_PORT" ]; then DEPLOY_PORT=22; fi
          ssh -o StrictHostKeyChecking=accept-new -p "$DEPLOY_PORT" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF'
          set -euo pipefail
          cd /opt/smart-move
          git fetch origin
          git reset --hard origin/main
          /opt/smart-move/.venv/bin/pip install -r /opt/smart-move/backend/requirements.txt
          sudo cp /opt/smart-move/deploy/aws/nginx-smart-move.conf /etc/nginx/sites-available/smart-move
          sudo nginx -t
          sudo systemctl restart smart-move-backend
          sudo systemctl reload nginx
          EOF
